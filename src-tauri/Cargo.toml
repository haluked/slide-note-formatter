[package]
name = "slide-note-formatter"
version = "2.0.0"
description = "Slayt Not Formatlayıcı - A4 Handout Formatter"
authors = ["haluked"]
license = "MIT"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
regex = "1"
dirs = "6"
rfd = "0.17"
